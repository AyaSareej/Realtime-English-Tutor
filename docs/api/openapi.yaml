    get:
      summary: Health Live
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Live Health Live Get
  /health/ready:
    get:
      summary: Health Ready
      operationId: health_ready_health_ready_get
      responses:
        '200':
