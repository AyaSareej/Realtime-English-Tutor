components:
  schemas:
    AssessmentCreateRequest:
      properties:
        user_id:
          type: string
          maxLength: 128
          minLength: 1
          title: User Id
        assessment_type:
          type: string
          const: conversational-placement
          title: Assessment Type
          default: conversational-placement
        target_range:
          items:
            $ref: '#/components/schemas/CEFRLevel'
          type: array
          title: Target Range
        language:
          type: string
          const: en
          title: Language
          default: en
        interface_language:
          type: string
          enum:
          - en
          - ar
          title: Interface Language
          default: en
        form_seed:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Form Seed
      additionalProperties: false
      type: object
      required:
      - user_id
      title: AssessmentCreateRequest
    AssessmentCreateResponse:
      properties:
        assessment_id:
          type: string
